name: Publish

# Tag-driven, so the published version always corresponds to a reviewable commit
# rather than to whatever `main` happened to contain.
on:
  push:
    tags: ['v*']
  # Manual runs are useful for a re-publish after a transient registry failure.
  workflow_dispatch:

# Least privilege, plus the one permission OIDC needs. Without `id-token: write`
# the npm CLI has nothing to exchange for a publish token and fails ENEEDAUTH.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No caching: a release build should not be able to consume a stale or
      # poisoned cache entry.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          cache: false

      # The tag is the release identity, so a mismatch is a mistake worth
      # stopping for rather than publishing a version nobody asked for.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "releasing $pkg"

      # Never publish something the gate has not seen.
      - name: Format and lint
        run: vp check

      - name: Full gate
        run: vp run ci

      - name: Mutation gate
        run: vp run test:mutation

      # Authenticates through OIDC — the workflow's identity is exchanged for a
      # short-lived publish token, so no NPM_TOKEN secret exists to leak or
      # rotate. Requires a matching trusted publisher on npmjs.com:
      #
      #   Organization or user  viztor
      #   Repository            dsh-healer
      #   Workflow filename     publish.yml
      #   Allowed actions       npm publish   ← must be ticked
      #
      # The last one matters: trusted publishers created after 2026-09-03 default
      # to `npm stage publish` only, which would stage the release for manual
      # approval instead of publishing it.
      - name: Publish
        run: npm publish
