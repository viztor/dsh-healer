name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin declares `engines.node >= 24`. Both the floor and the
        # current release are exercised, so a break on either is caught here
        # rather than by a user.
        node-version: ['24', '26']

    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact release: the `v1` tag no longer receives updates and
      # the project's own guidance is not to use it. setup-vp installs Vite+,
      # the requested Node, and the package manager, and runs `vp install`
      # (which also triggers this package's `prepare` build) with caching.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      - name: Format and lint
        run: vp check

      - name: Typecheck src
        run: vp run typecheck:src

      - name: Typecheck tests
        run: vp run typecheck

      - name: Typecheck scripts and config
        run: vp run typecheck:scripts

      - name: Build bundles
        run: vp run build

      # The full suite, with the harness guard **active**. It used to run with
      # `DSH_HEAL_ALLOW_NO_HARNESS=1` because the resolver only searched the pnpm
      # dlx cache under `$HOME`, which CI does not have — so the harness was
      # "absent" there even though `pnpm install` had just installed it as a peer.
      # The resolver now searches this installation's own store first, so the
      # guard can do its job: if the harness ever stops resolving, CI fails here
      # instead of quietly running 500 tests with the harness-dependent ones
      # skipped.
      - name: Run the suite
        run: vp test

      # Already part of the suite above. It runs again as its own step because a
      # guard whose job is "this must always run" deserves a status of its own in
      # the UI rather than being one line among 547.
      - name: Machine-path leak guard
        run: vp test no-machine-paths

      - name: Mutation gate
        run: vp run test:mutation

      - name: Upstream verifier
        run: vp run test:upstream
